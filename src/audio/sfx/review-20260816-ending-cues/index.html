      --muted: #667069;
      --line: #d7ddd7;
      --moss: #2f6a4b;
      --moss-soft: #e5f0e9;

    }

    html {
      scroll-behavior: smooth;
    }

    body {

      line-height: 1.5;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button,
    a,
    input[type="radio"] {
      -webkit-tap-highlight-color: transparent;
    }

    .topbar {
      position: sticky;
      z-index: 10;
      top: 0;
      border-bottom: 1px solid rgba(215, 221, 215, 0.92);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
    }

    .topbar-inner,
    .page-header,
    main,
    footer {

    }

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-weight: 700;
    }

    .brand-mark {
      width: 12px;
      height: 28px;
      flex: 0 0 auto;
      border-radius: 3px;
      background: var(--moss);

    .brand span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .progress {
      min-width: 60px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      padding: 7px 12px;
      cursor: pointer;
    }

    .command:hover {
      border-color: #9da89f;
      background: var(--surface-soft);
    }

    .command.primary {

      background: var(--moss);

    .eyebrow {

      color: var(--amber);
      font-size: 13px;
      font-weight: 700;
    }

      margin: 0;
      font-size: clamp(30px, 5vw, 54px);
      line-height: 1.08;
      letter-spacing: 0;
    }

      display: flex;
      flex-wrap: wrap;
      gap: 10px 22px;
      margin-top: 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .summary strong {
      color: var(--ink);
    }

    main {
      padding-bottom: 56px;
    }

    .cue-section {
      padding: 34px 0 46px;
      border-top: 1px solid var(--line);
    }

    .cue-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 20px;
      margin-bottom: 20px;
    }

    .cue-index {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

      font-size: 24px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .cue-event {
      max-width: 650px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .cue-state {
      min-width: 96px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      padding: 8px 10px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .cue-state.done {
      border-color: #99bba7;
      background: var(--moss-soft);
      color: var(--moss);
      font-weight: 700;
    }

    .candidate-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .candidate {
      position: relative;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 1px 0 rgba(31, 48, 38, 0.03);
      padding: 16px;
      transition: border-color 140ms ease, box-shadow 140ms ease, background 140ms ease;

    .candidate:hover {
      border-color: #aab4ac;
      box-shadow: var(--shadow);
    }

    .candidate.selected {

      background: #fbfdfb;
      box-shadow: 0 0 0 2px rgba(47, 106, 75, 0.12);
    }

    .candidate.playing {
      border-color: var(--amber);
      box-shadow: 0 0 0 2px rgba(167, 101, 28, 0.12);
    }

    .candidate-top {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      align-items: start;
      gap: 10px;
    }

      width: 18px;
      height: 18px;
      margin: 3px 0 0;
      accent-color: var(--moss);
      cursor: pointer;
    }

    .candidate-title {

      min-width: 0;
      font-size: 15px;
      font-weight: 700;
      overflow-wrap: anywhere;
      cursor: pointer;

      padding: 3px 7px;
      font-size: 11px;
      font-weight: 700;
      text-align: center;

      color: var(--amber);

      color: var(--blue);

      color: var(--muted);

      width: 100%;

      bottom: 18px;

      color: white;
      padding: 10px 14px;

      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 160ms ease, transform 160ms ease;

      opacity: 1;
      transform: translateY(0);

        grid-template-columns: 22px minmax(0, 1fr);
      }

      .source-badge {
        grid-column: 2;
        width: fit-content;
      }

      .meta {
        margin-left: 32px;
      }

      "ending-fortune-appear": "pixabay-appear-01",
      "ending-fortune-vanish": "suno-vanish-a3c2"
    };
    let saved = loadSaved();
    let toastTimer = 0;

    function loadSaved() {
      try {
        return JSON.parse(localStorage.getItem(storageKey)) || {
          selections: { ...defaultSelections },
          notes: {}
        };
      } catch {
        return { selections: { ...defaultSelections }, notes: {} };
      }
    }

    function persist() {
      localStorage.setItem(storageKey, JSON.stringify(saved));
      refreshState();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function formatDuration(value) {
      return value < 10 ? `${value.toFixed(value % 1 ? 1 : 0)} 秒` : `${Math.round(value)} 秒`;
    }

    function render() {
      reviewRoot.innerHTML = cues.map((cue, cueIndex) => `
        <section class="cue-section" data-cue="${cue.id}">
          <div class="cue-heading">
            <div>
              <p class="cue-index">事件 ${String(cueIndex + 1).padStart(2, "0")}</p>
              <h2>${cue.title}</h2>
              <p class="cue-event">${cue.event}</p>
            </div>
            <div class="cue-state" id="state-${cue.id}">未选择</div>
          </div>
          <div class="candidate-grid">
            ${cue.candidates.map((candidate, candidateIndex) => `
              <article class="candidate" data-candidate="${candidate.id}">
                <div class="candidate-top">
                  <input
                    id="${candidate.id}"
                    type="radio"
                    name="${cue.id}"
                    value="${candidate.id}"
                    ${saved.selections[cue.id] === candidate.id ? "checked" : ""}
                  >
                  <label class="candidate-title" for="${candidate.id}">
                    ${String(candidateIndex + 1).padStart(2, "0")} / ${candidate.title}
                  </label>
                  <span class="source-badge ${candidate.source.toLowerCase()}">${candidate.source}</span>
                </div>
                <div class="meta">
                  <span>${formatDuration(candidate.duration)}</span>
                  <span>${candidate.creator}</span>
                  <a href="${candidate.detail}" target="_blank" rel="noreferrer">来源页</a>
                </div>
                <audio controls preload="metadata" src="${candidate.file}"></audio>
              </article>
            `).join("")}
          </div>
          <div class="notes">
            <label for="notes-${cue.id}">评审备注</label>
            <textarea id="notes-${cue.id}" data-notes="${cue.id}">${saved.notes[cue.id] || ""}</textarea>
          </div>
        </section>
      `).join("");

      bindEvents();
      refreshState();
    }

    function bindEvents() {
      document.querySelectorAll('input[type="radio"]').forEach((radio) => {
        radio.addEventListener("change", () => {
          saved.selections[radio.name] = radio.value;
          persist();
        });
      });

      document.querySelectorAll("textarea[data-notes]").forEach((field) => {
        field.addEventListener("input", () => {
          saved.notes[field.dataset.notes] = field.value;
          persist();
        });
      });

      document.querySelectorAll("audio").forEach((audio) => {
        audio.addEventListener("play", () => {
          document.querySelectorAll("audio").forEach((other) => {
            if (other !== audio) {
              other.pause();
              other.currentTime = 0;
            }
          });
          document.querySelectorAll(".candidate").forEach((card) => card.classList.remove("playing"));
          audio.closest(".candidate").classList.add("playing");
        });
        audio.addEventListener("pause", () => {
          audio.closest(".candidate").classList.remove("playing");
        });
        audio.addEventListener("ended", () => {
          audio.closest(".candidate").classList.remove("playing");
        });
      });
    }

    function refreshState() {
      let count = 0;
      cues.forEach((cue) => {
        const selectedId = saved.selections[cue.id];
        const state = document.getElementById(`state-${cue.id}`);
        document.querySelectorAll(`[data-cue="${cue.id}"] .candidate`).forEach((card) => {
          card.classList.toggle("selected", card.dataset.candidate === selectedId);
        });
        if (selectedId) {
          count += 1;
          state.textContent = "已选择";
          state.classList.add("done");
        } else {
          state.textContent = "未选择";
          state.classList.remove("done");
        }
      });
      progress.textContent = `${count} / ${cues.length}`;
    }

    function stopAll() {
      document.querySelectorAll("audio").forEach((audio) => {
        audio.pause();
        audio.currentTime = 0;
      });
    }

    function exportSelection() {
      const payload = {
        project: "h5-balance-mossfall",
        review: "ending-sfx-20260816",
        exported_at: new Date().toISOString(),
        selections: cues.map((cue) => {
          const selected = cue.candidates.find((candidate) => candidate.id === saved.selections[cue.id]);
          return {
            cue: cue.id,
            title: cue.title,
            selected: selected || null,
            notes: saved.notes[cue.id] || ""
          };
        })
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = "mossfall-ending-sfx-selection.json";
      anchor.click();
      URL.revokeObjectURL(url);
      showToast("选择结果已导出");
    }

    document.getElementById("stopAll").addEventListener("click", stopAll);
    document.getElementById("clearAll").addEventListener("click", () => {
      stopAll();
      saved = { selections: { ...defaultSelections }, notes: {} };
      localStorage.setItem(storageKey, JSON.stringify(saved));
      render();
      showToast("已恢复确认选择");
    });
    document.getElementById("exportSelection").addEventListener("click", exportSelection);

    render();
  </script>
</body>
</html>
